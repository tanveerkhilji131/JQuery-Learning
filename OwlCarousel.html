<script>
    $(function() {
  // Owl Carousel
  var owl = $(".owl-carousel");
  owl.owlCarousel({
    
    animateOut: 'fadeOut',
      animateIn: 'flipInX',
    //   items:1,
      margin:30,
      stagePadding:30,
      smartSpeed:450,
      dots: true,
      autoplay: true,
      autoplayTimeout: 1000,
      autoplayHoverPause: true,
      loop: true,
    responsive:{
        0:{
            items:1,
            nav:true
        },
        600:{
            items:3,
            nav:false
        },
        1000:{
            items:4,
            nav:true,
            loop:true
        }
    }
  });
});


$(document).ready(function() {
  // add all to same gallery
  $(".item a").attr("data-fancybox","mygallery");
  // assign captions and title from alt-attributes of images:
  $(".item a").each(function(){
    $(this).attr("data-caption", $(this).find("img").attr("alt"));
    $(this).attr("title", $(this).find("img").attr("alt"));
  });
  // start fancybox:
	$(".item a").fancybox();
});

</script>
